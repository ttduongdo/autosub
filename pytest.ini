[pytest]
testpaths = tests
markers =
    song: slow integration test that downloads a real song (deselected by default; run with -m song)
    dataset: slow integration test that hits live external sources (Billboard chart, lyrics.ovh, YouTube) and downloads real tracks (deselected by default; run with -m dataset)
    train: slow smoke test that runs a real (tiny) Whisper fine-tuning step (deselected by default; run with -m train)
addopts = -m "not song and not dataset and not train"
